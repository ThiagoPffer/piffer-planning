<div class="modal-overlay" [ngClass]="{'show': showNameDialog}" id="modal">
    <div class="modal">
        <div class="input-group">
            <label for="name-input">Digite seu nome</label>
            <input type="text" id="name-input" [(ngModel)]="userName">
        </div>
        <button class="default-button" (click)="saveUser()">Enviar</button>
    </div>
</div>
<section class="main-section">
    <div class="board">
        <header>
            <div class="header-title">
                <a href class="mdi mdi-arrow-left" [routerLink]="['/planning-list']" routerLinkActive="router-link-active"></a>
                <h2>{{ planningName }}</h2>
            </div>
            <span *ngIf="voters.length">Votantes: {{ voters.length }}</span>
        </header>
        <div class="voter-card-list">
            <div class="voter-card-group" *ngFor="let voter of voters">
                <div 
                    class="voter-card" 
                    [@cardTurn]="voter?.votedOption && !currentIssue?.averageVoting ? 'back' : 'front'">
                    <span *ngIf="currentIssue?.averageVoting">{{ voter?.votedOption }}</span>
                </div>
                <span class="voter-name">
                    {{ voter.name }}
                </span>
            </div>
        </div>
        <footer>
            <div class="option-card-list" *ngIf="currentIssue?.status === 'Votando'">
                <div class="option-card" 
                    [ngClass]="{'selected': votedOption === option}"
                    *ngFor="let option of options" 
                    (click)="onVote(option)"
                >
                    <span>{{option}}</span>
                </div>
            </div>
            <div class="average-card" *ngIf="currentIssue?.averageVoting">
                Média
                <span>{{ currentIssue?.averageVoting }}</span>
            </div>
        </footer>
    </div>
    <div class="info">
        <header>
            <h2>Issues</h2>
            <button type="button" class="icon-button" (click)="onAddNewIssue()">
                <span class="mdi" [ngClass]="{
                    'mdi-plus': !isAddingNewIssue,
                    'mdi-chevron-right': isAddingNewIssue
                }"></span>
            </button>
        </header>
        <ul class="info-issue-list">
            <li class="info-issue-list-item" *ngFor="let issue of issues" [ngStyle]="{'border': issue.status === 'Votando' ? '2px solid var(--primaria)' : '2px solid white'}">
                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <div>
                        <h4>{{ issue.description }}</h4>
                        <a [href]="issue.url" target="_blank">Issue link</a>
                    </div>
                    <div style="display: flex; flex-direction: row; gap: 10px;">
                        <span class="issue-badge" *ngIf="issue.status !== 'Votar'">{{ issue.status }}</span>
                        <button 
                            type="button" 
                            class="vote-button" 
                            (click)="onStartVoting(issue)" 
                            *ngIf="issue.status === 'Votar'"
                            [disabled]="currentIssue?.status === 'Votando'"
                        >
                            Votar
                        </button>
                        <button type="button" class="icon-button" (click)="onReset(issue)" *ngIf="issue.status !== 'Votar'">
                            <span class="mdi mdi-refresh"></span>
                        </button>
                    </div>
                </div>
                <span class="average-badge" *ngIf="issue.averageVoting">{{ issue.averageVoting }}</span>
            </li>
        </ul>
    </div>
    <div class="new-issue" [@newIssueAppear]="isAddingNewIssue ? 'opened' : 'closed'">
        <header>
            <h2>Nova issue</h2>
        </header>
        <div 
            style="display: flex; flex-direction: column; gap: 15px;" 
            [formGroup]="addNewIssueFormGroup"
            *ngIf="isAddingNewIssue"
        >
            <div class="input-group">
                <label for="issue-desc-input">Descrição da issue</label>
                <input type="text" id="issue-desc-input" formControlName="description">
            </div>
            <div class="input-group">
                <label for="issue-link-input">Link da issue</label>
                <input type="text" id="issue-link-input" formControlName="url">
            </div>
            <button class="default-button" (click)="onSaveNewIssue()">Salvar</button>
        </div>
    </div>
</section>
