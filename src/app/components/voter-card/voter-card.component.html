<div class="voter-card-group" #cardElement (click)="onPoke()">
    <div 
        class="voter-card" 
        [@cardTurn]="voter.votedOption && !votingFinished && !userIsObserver ? 'back' : 'front'">
        <span *ngIf="votingFinished || userIsObserver">{{ voter.votedOption }}</span>
    </div>
    <span class="voter-name">
        {{ voter.name }}
    </span>
</div>
