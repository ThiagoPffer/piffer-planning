<div class="voter-card-group" #cardElement>
    <div 
        class="voter-card" 
        [@cardTurn]="voter.votedOption && !votingFinished ? 'back' : 'front'">
        <span *ngIf="votingFinished">{{ voter.votedOption }}</span>
    </div>
    <span class="voter-name" (click)="onPoke()">
        {{ voter.name }}
    </span>
</div>
